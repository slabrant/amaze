name: Mazes
run-name: "Mazes: ${{ inputs.level }}, ${{ inputs.per_page || '1' }} per page, ${{ inputs.black && 'black' || 'colour' }}, seed ${{ inputs.seed || 'random' }}${{ inputs.stl && ', with STL' || '' }}"

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Seed (blank for a random one)
        required: false
        default: ""
      level:
        description: Level of every maze in the book
        type: choice
        default: all
        options: [all, trivial, easy, standard, hard]
      per_page:
        description: Mazes to a page
        required: false
        default: "1"
      black:
        description: Black ink only
        type: boolean
        default: false
      stl:
        description: Also write a maze for 3D printing
        type: boolean
        default: true
      stl_width:
        description: STL grid width (blank for Easy size)
        required: false
        default: ""
      stl_height:
        description: STL grid height (blank for Easy size)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  mazes:
    runs-on: ubuntu-latest
    steps:
      - name: Programs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/release
          gh release download programs --repo "$GITHUB_REPOSITORY" --pattern amaze-linux.tar.gz --output - | tar -xz -C target/release
      - name: Book
        id: book
        env:
          SEED: ${{ inputs.seed }}
          LEVEL: ${{ inputs.level }}
          PER_PAGE: ${{ inputs.per_page }}
          BLACK: ${{ inputs.black }}
        run: |
          seed=${SEED:-$(shuf -i 0-4294967295 -n 1)}
          per_page=${PER_PAGE:-1}
          ink=colour
          [ "$BLACK" = true ] && ink=black
          name="$LEVEL-${per_page}per-$ink-seed$seed"
          args=("mazes/book-$name.pdf" "$seed" --per-page "$per_page")
          [ "$LEVEL" != all ] && args+=(--level "$LEVEL")
          [ "$BLACK" = true ] && args+=(--black)
          mkdir -p mazes
          ./target/release/amaze "${args[@]}"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "- Book: \`book-$name.pdf\`" >> "$GITHUB_STEP_SUMMARY"
      - name: STL
        id: stl
        if: inputs.stl
        env:
          SEED: ${{ steps.book.outputs.seed }}
          WIDTH: ${{ inputs.stl_width }}
          HEIGHT: ${{ inputs.stl_height }}
        run: |
          args=(mazes/stl.stl "$SEED")
          if [ -n "$WIDTH" ] || [ -n "$HEIGHT" ]; then
            args+=("${WIDTH:?width and height go together}" "${HEIGHT:?width and height go together}")
          fi
          size=$(./target/release/stl "${args[@]}" | sed -n 's/^size //p')
          name="maze-$size-seed$SEED"
          mv mazes/stl.stl "mazes/$name.stl"
          mv mazes/stl.pdf "mazes/$name.pdf"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "- STL: \`$name.stl\`, the same maze on paper: \`$name.pdf\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          path: mazes/book-${{ steps.book.outputs.name }}.pdf
          archive: false
      - uses: actions/upload-artifact@v7
        if: inputs.stl
        with:
          path: mazes/${{ steps.stl.outputs.name }}.stl
          archive: false
      - uses: actions/upload-artifact@v7
        if: inputs.stl
        with:
          path: mazes/${{ steps.stl.outputs.name }}.pdf
          archive: false
